<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — ZomDrop</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#081320">
  <link rel="icon" type="image/png" href="/img/icon-64.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; }
    .lost img.logo { width: min(80vw, 420px); height: auto; filter: drop-shadow(0 10px 26px #000a); }
    .lost .num { margin: 22px 0 0; font-family: "Luckiest Guy", system-ui, sans-serif; font-size: clamp(64px, 18vw, 120px); line-height: 1; color: var(--gold); }
    .lost p { margin: 10px 0 0; font-size: 19px; }
    .lost p[lang="ar"] { font-family: "Lalezar", system-ui, sans-serif; font-size: 24px; color: #fff3c9; text-align: center; }
    .lost .links { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .lost .links a { padding: 11px 22px; border: 1px solid var(--gold); border-radius: 999px; color: var(--gold); font-weight: 700; }
    .lost .links a:hover { background: var(--gold); color: #1b1407; text-decoration: none; }
  </style>
</head>
<body>
  <!-- Shown by GitHub Pages for any address that does not exist. Paths start with "/" so it works from any folder. -->
  <main class="lost">
    <a href="/"><img class="logo" src="/img/logo.webp" alt="ZomDrop" width="1100" height="348"></a>
    <p class="num">404</p>
    <p>This page got flung over the moon.</p>
    <p lang="ar" dir="rtl">هذه الصفحة قُذفت فوق القمر.</p>
    <div class="links">
      <a href="/">Back to the farm</a>
      <a href="/ar/" lang="ar">العودة إلى المزرعة</a>
    </div>
  </main>
</body>
</html>
